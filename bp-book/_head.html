<title>Pressure Down</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap">
<style>
  /* A printed guide book, deliberately single-theme: this is paper. Every
     colour is painted explicitly so the page holds on any host background. */
  :root {
    --bench: #D8CFC0;
    --paper: #F5EFE6;
    --paper-2: #FBF8F2;
    --paper-edge: #E0D4C4;
    --ink: #2C2C2C;
    --ink-2: #5A5347;
    --ink-3: #8A8272;
    --rule: #E0D4C4;

    --indigo: #0F6E8A;
    --indigo-soft: #DCEEF4;
    --ochre: #D2840F;
    --ochre-soft: #FBEFD6;
    --clay: #A52A1F;
    --clay-soft: #FBE0DC;
    --moss: #3A7A3A;
    --moss-soft: #E1F0DF;
    --plum: #6B2D82;
    --plum-soft: #F0E4F5;
    --on-solid: #FFFFFF;

    --display: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    --body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Poppins", system-ui, sans-serif;

    --r: 16px;
    --r-sm: 11px;
    --shadow: 0 2px 14px rgba(44,44,44,0.07);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bench); color: var(--ink); font-family: var(--body); line-height: 1.78; -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; display: block; }

  .stack { max-width: 860px; margin: 0 auto; padding-inline: 14px; padding-block: 0 90px; display: flex; flex-direction: column; gap: 30px; }

  .page { background: var(--paper); border-radius: var(--r); box-shadow: var(--shadow); padding: clamp(30px, 5.5vw, 62px) clamp(24px, 5vw, 60px) clamp(48px, 5.5vw, 64px); position: relative; }
  .page.flush { padding: 0; overflow: hidden; }
  .folio { position: absolute; bottom: 18px; right: clamp(24px, 5vw, 60px); font-size: 0.78rem; font-weight: 600; color: var(--ink-3); }
  .runhead { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: var(--indigo); margin-bottom: 28px; }

  p { font-size: 1.07rem; line-height: 1.78; margin: 0 0 19px; max-width: 62ch; }
  p:last-child { margin-bottom: 0; }
  p.lead { font-size: 1.24rem; line-height: 1.62; font-weight: 500; margin-bottom: 22px; }
  .kicker { font-size: 0.76rem; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700; color: var(--ochre); margin: 0 0 11px; }

  .chap-band { background: var(--indigo); color: var(--on-solid); border-radius: var(--r); padding: 32px clamp(24px, 4vw, 40px) 34px; margin-bottom: 34px; }
  .chap-band .kicker { color: #FFDFA4; margin-bottom: 2px; }
  h2.chapno { font-size: clamp(2.6rem, 9vw, 4rem); font-weight: 800; line-height: 0.92; letter-spacing: -0.04em; margin: 0; color: rgba(255,255,255,0.30); }
  h2.chaptitle { font-size: clamp(1.4rem, 4.2vw, 2rem); font-weight: 700; line-height: 1.12; letter-spacing: -0.02em; margin: -8px 0 0; color: var(--on-solid); text-wrap: balance; }

  h3 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.015em; margin: 38px 0 12px; line-height: 1.35; color: var(--indigo); text-wrap: balance; }
  h3.first { margin-top: 0; }
  h4 { font-size: 1.05rem; font-weight: 700; margin: 24px 0 9px; }

  .pullquote { background: var(--indigo-soft); border-radius: var(--r); padding: 28px 32px; font-size: clamp(1.14rem, 2.9vw, 1.38rem); font-weight: 600; font-style: italic; line-height: 1.48; color: var(--indigo); margin: 34px 0; max-width: 50ch; }

  ul, ol { margin: 0 0 19px; padding-left: 22px; display: flex; flex-direction: column; gap: 12px; max-width: 62ch; }
  li { font-size: 1.05rem; line-height: 1.7; }
  ul.marks { list-style: none; padding: 0; gap: 9px; }
  ul.marks li { position: relative; padding-left: 28px; }
  ul.marks li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 10px; height: 10px; border-radius: 50%; background: var(--ochre); }

  .box { padding: 16px 20px; margin: 28px 0; border-radius: var(--r-sm); background: var(--ochre-soft); border: 1px solid var(--ochre); }
  .box.good { background: var(--moss-soft); border-color: var(--moss); }
  .box.cool { background: var(--indigo-soft); border-color: var(--indigo); }
  /* Clay is the only alarm colour in the book, and this is the box that
     carries the sentence about never stopping the tablet, so it keeps the
     one slightly heavier edge. */
  .box.warn { background: var(--clay-soft); border-color: var(--clay); border-width: 1.5px; }
  .box h4 { margin-top: 0; color: var(--ochre); }
  .box.warn h4 { color: var(--clay); }
  .box.good h4 { color: var(--moss); }
  .box.cool h4 { color: var(--indigo); }
  .box .disc { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(165, 42, 31, 0.32); font-size: 0.97rem; font-style: italic; }
  .box p, .box li { font-size: 1.05rem; line-height: 1.72; }
  .box .k { font-size: 0.73rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--ochre); margin: 0 0 7px; }
  .box.warn .k { color: var(--clay); }
  .box.good .k { color: var(--moss); }
  .box.cool .k { color: var(--indigo); }

  figure { margin: 30px 0 48px; }
  figure img { border-radius: var(--r); }
  figcaption { font-size: 0.94rem; line-height: 1.62; color: var(--ink-2); margin: 13px auto 0; font-weight: 500; max-width: 56ch; text-align: center; text-wrap: balance; }
  .bleed { margin-inline: calc(-1 * clamp(20px, 4.4vw, 52px)); }
  .bleed img { border-radius: 0; }

  .t-wrap { overflow-x: auto; margin: 30px 0; border-radius: var(--r); border: 1.5px solid var(--rule); background: var(--paper-2); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 16px 18px; border-bottom: 1px solid var(--rule); font-size: 1.05rem; line-height: 1.62; vertical-align: top; }
  thead th { background: var(--indigo); color: var(--on-solid); font-size: 0.76rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; border-bottom: 0; }
  tbody tr:nth-child(even) td { background: rgba(224,212,196,0.24); }
  tbody tr:last-child td { border-bottom: 0; }
  td.k { font-weight: 700; color: var(--ink); }
  th, td { overflow-wrap: break-word; }

  .week { border-radius: var(--r); overflow: hidden; margin: 26px 0; background: var(--paper-2); border: 1.5px solid var(--rule); }
  .week-head { background: var(--indigo); color: var(--on-solid); padding: 17px 22px; display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: baseline; }
  .week-head .n { font-size: 0.76rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: #FFDFA4; }
  .week-head .t { font-size: 1.3rem; font-weight: 700; line-height: 1.15; letter-spacing: -0.015em; }
  .week-body { padding: 22px 22px 24px; }
  .week-body .job { font-size: 1.09rem; font-weight: 600; margin: 0 0 18px; line-height: 1.6; color: var(--ink); }
  .week-sec { margin-top: 19px; }
  .week-sec .lbl { font-size: 0.72rem; letter-spacing: 0.13em; text-transform: uppercase; font-weight: 700; color: var(--ochre); display: block; margin-bottom: 8px; }
  .week-sec ul { margin: 0; gap: 9px; }
  .week-sec li, .week-sec p { font-size: 1.02rem; line-height: 1.68; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .chip { background: var(--moss); color: var(--on-solid); border-radius: 999px; font-size: 0.82rem; font-weight: 600; padding: 6px 15px; }
  .week-quote { background: var(--ochre-soft); border-radius: var(--r-sm); padding: 17px 20px; font-style: italic; font-weight: 600; color: var(--ink); font-size: 1.04rem; line-height: 1.6; margin-top: 20px; }

  .toc { display: flex; flex-direction: column; gap: 11px; }
  .toc-row { display: grid; grid-template-columns: 44px minmax(0,1fr) 40px; gap: 16px; padding: 17px 18px; border-radius: var(--r-sm); background: var(--paper-2); border: 1px solid var(--rule); align-items: center; }
  .toc-row .n { font-size: 1.02rem; font-weight: 800; color: var(--on-solid); background: var(--indigo); border-radius: 50%; width: 34px; height: 34px; display: grid; place-items: center; }
  .toc-row .t { font-weight: 600; font-size: 1.06rem; line-height: 1.45; }
  .toc-row .s { font-size: 0.95rem; line-height: 1.5; margin-top: 4px; color: var(--ink-2); display: block; font-weight: 400; }
  .toc-row .p { font-size: 0.88rem; font-weight: 700; color: var(--ochre); text-align: right; }

  /* Contents, set the way the Diabetes Fix sets it: a small "Table of" over
     a solid CONTENTS banner, a rule, then every chapter with its actual
     sections listed beneath. Page numbers are deliberately absent — theirs
     has none either, and ours would be wrong until the folios are renumbered
     for the fourteen meal pages. */
  .toc-pre { font-weight: 700; font-size: 1.02rem; margin: 0 0 12px; }
  .toc-banner { background: var(--indigo); color: var(--on-solid); border-radius: var(--r); padding: clamp(16px, 3vw, 24px); text-align: center; font-size: clamp(1.7rem, 6vw, 2.7rem); font-weight: 800; letter-spacing: 0.07em; line-height: 1.1; }
  .toc-rule { border: 0; border-top: 1px solid var(--rule); margin: 26px 0 34px; }
  .toc2 { display: flex; flex-direction: column; gap: 28px; }
  .toc2 .ch-line { color: var(--clay); font-weight: 700; font-size: 1.08rem; line-height: 1.4; margin: 0 0 10px; max-width: none; }
  .toc2 ul { list-style: none; margin: 0; padding: 0 0 0 16px; gap: 8px; max-width: none; }
  .toc2 li { position: relative; padding-left: 16px; font-size: 1rem; line-height: 1.55; color: var(--ink); }
  .toc2 li::before { content: "\2022"; position: absolute; left: 0; color: var(--ink-3); }
  /* Five myths. No card, no border, no fill — the numeral and the colour do
     the separating, and a hairline between entries does the rest. Boxes made
     the page look like a form to fill in rather than something to read. */
  .myth { padding-block: 26px; border-top: 1px solid var(--rule); }
  .myth:first-of-type { border-top: 0; padding-top: 14px; }
  .myth-n { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ochre); margin: 0 0 10px; }
  .myth-claim { font-size: clamp(1.12rem, 2.9vw, 1.32rem); font-weight: 700; font-style: italic; color: var(--clay); line-height: 1.4; margin: 0 0 18px; max-width: 46ch; }
  .truth-tag { display: inline-block; background: var(--moss); color: var(--on-solid); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 11px; border-radius: 999px; margin-bottom: 12px; }
  .truth-line { font-size: 1.12rem; font-weight: 700; color: var(--moss); line-height: 1.5; margin: 0 0 13px; max-width: 54ch; }
  .myth p.expl { font-size: 1.04rem; line-height: 1.75; margin: 0; }
  .myth-ref { display: block; margin-top: 14px; font-size: 0.93rem; font-weight: 600; color: var(--indigo); }
  /* Figures 3 and 4 were SVG; see cols.py. Colour never carries the meaning
     alone here -- every column has a worded header and every row a mark. */
  .cols { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(212px, 1fr)); }
  .col { border-radius: var(--r-sm); overflow: hidden; border: 1.5px solid; }
  .col > p.h { margin: 0; padding: 13px 14px; text-align: center; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--on-solid); max-width: none; line-height: 1.3; }
  .col ul { list-style: none; display: block; margin: 0; padding: 2px 16px 8px; max-width: none; }
  .col li { position: relative; padding: 13px 0 13px 30px; font-size: 1.05rem; line-height: 1.5; border-top: 1px solid rgba(90, 83, 71, 0.16); }
  .col li:first-child { border-top: 0; }
  .col li::before { position: absolute; left: 2px; top: 12px; width: 18px; font-weight: 700; line-height: 1.5; }
  .col.go { border-color: var(--moss); background: var(--moss-soft); }
  .col.go > p.h { background: var(--moss); }
  .col.go li::before { content: "✓"; color: var(--moss); }
  .col.care { border-color: var(--ochre); background: var(--ochre-soft); }
  .col.care > p.h { background: var(--ochre); }
  .col.care li::before { content: "●"; color: var(--ochre); font-size: 0.62rem; top: 15px; }
  .col.stop { border-color: var(--clay); background: var(--clay-soft); }
  .col.stop > p.h { background: var(--clay); }
  .col.stop li::before { content: "✕"; color: var(--clay); }
  .col.risk { border-color: var(--clay); background: var(--clay-soft); }
  .col.risk > p.h { background: var(--clay); }
  .col.risk li::before { content: "!"; color: var(--clay); font-size: 1.1rem; }
  /* The answers worksheet. The rule is what the reader writes on, so it has
     to survive both printing and a screenshot: a real border-bottom rather
     than an underscore run, which would break differently in every font. */
  .qa { counter-reset: qa; display: flex; flex-direction: column; gap: 22px; margin: 26px 0 8px; }
  .qa-item { position: relative; padding-left: 34px; }
  .qa-item::before { counter-increment: qa; content: counter(qa); position: absolute; left: 0; top: 1px; width: 24px; height: 24px; border-radius: 50%; background: var(--indigo); color: var(--on-solid); font-size: 0.8rem; font-weight: 700; display: grid; place-items: center; }
  .qa-q { font-size: 1.02rem; font-weight: 600; line-height: 1.5; margin: 0 0 6px; max-width: none; color: var(--ink); }
  .qa-line { height: 27px; border-bottom: 1px solid var(--rule); }
  .qa-line.second { height: 30px; }

  .cover { position: relative; background: #FFFFFF; }
  .cover img { width: 100%; }

  .fig { margin: 32px 0; }
  .fig svg { width: 100%; height: auto; display: block; }
  .fig-title { font-size: 0.73rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--ochre); margin: 0 0 10px; }

  .days { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin: 30px 0; }
  .day { border-radius: var(--r); overflow: hidden; border: 1.5px solid var(--rule); background: var(--paper-2); }
  .day-head { background: var(--moss); color: var(--on-solid); padding: 12px 18px; }
  .day-head .dn { font-size: 0.92rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .day-body { padding: 18px 20px 20px; }
  .day-body p { font-size: 1rem; margin: 0 0 13px; line-height: 1.6; max-width: none; }
  .day-body .ml { display: block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
  .day-habit { margin-top: 16px !important; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--ochre); font-weight: 600; }
  .mealhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; background: var(--moss); color: var(--on-solid); border-radius: var(--r); padding: 18px 24px; margin-bottom: 26px; }
  .mealhead .mn { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
  .mealhead .mt { font-size: 1.12rem; font-weight: 600; font-style: italic; opacity: 0.94; }
  .mealgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  .mealcol { background: var(--paper-2); border: 1.5px solid var(--rule); border-radius: var(--r-sm); padding: 16px 18px 18px; }
  .mealcol ul, .recipe ul, .between ul { margin: 0; padding-left: 20px; gap: 9px; }
  .mealcol li, .recipe li { font-size: 0.99rem; line-height: 1.6; }
  .lbl { display: block; font-size: 0.72rem; letter-spacing: 0.13em; text-transform: uppercase; font-weight: 700; color: var(--ochre); margin-bottom: 10px; }
  .between { background: var(--ochre-soft); border-radius: var(--r-sm); padding: 16px 20px; margin-top: 16px; font-size: 1rem; line-height: 1.7; }
  .recipe { border: 1.5px solid var(--indigo); border-radius: var(--r); overflow: hidden; margin-top: 26px; }
  .recipe-head { background: var(--indigo); color: var(--on-solid); padding: 14px 20px; font-weight: 700; font-size: 1.05rem; }
  .recipe-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 22px; padding: 20px; background: var(--paper-2); }
  .recipe-body p { font-size: 1rem; line-height: 1.7; margin: 0 0 12px; max-width: none; }
  .recipe-body .makes { font-size: 0.95rem; color: var(--ink-2); margin: 0; }
  .exrow { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; padding: 15px 0; border-bottom: 1px solid var(--rule); }
  .exrow:last-of-type { border-bottom: 0; }
  @media (max-width: 620px) { .exrow { grid-template-columns: minmax(0, 1fr); gap: 5px; } }
  .exrow .ex { font-weight: 700; font-size: 1.02rem; color: var(--indigo); }
  .exrow .dose { font-size: 1.01rem; font-weight: 600; margin: 0 0 6px; max-width: none; }
  .exrow .cue { font-size: 0.97rem; line-height: 1.65; color: var(--ink-2); margin: 0; max-width: none; }
  /* Prayers, set the way the Diabetes Fix sets them: no container, centred,
     bold italic, one line of verse per line, a rule top and bottom, and the
     two faiths as separate blocks rather than one run-on sentence. */
  .prayer { text-align: center; padding-block: 18px 6px; }
  .prayer h2 { font-size: clamp(1.3rem, 3.8vw, 1.72rem); font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--clay); margin: 0 0 20px; }
  .prayer hr { border: 0; border-top: 1px solid var(--rule-soft, #D9CDBA); max-width: 76%; margin: 0 auto; }
  .prayer .verse { font-weight: 700; font-style: italic; color: var(--indigo); font-size: clamp(1rem, 2.4vw, 1.14rem); line-height: 1.95; margin: 30px auto; max-width: 46ch; }
  .prayer .verse.second { margin-top: 26px; }
  .prayer .amen { font-weight: 700; font-style: italic; color: var(--indigo); font-size: clamp(1rem, 2.4vw, 1.14rem); margin: 0 auto 30px; max-width: none; }
  .tracker { display: grid; grid-template-columns: repeat(auto-fit, minmax(146px, 1fr)); gap: 12px; margin: 28px 0; }
  .tcell { border-radius: var(--r-sm); background: var(--paper-2); border: 1.5px solid var(--rule); padding: 15px 16px 16px; min-height: 104px; display: flex; flex-direction: column; gap: 9px; }
  .tcell .w { font-size: 0.71rem; letter-spacing: 0.11em; text-transform: uppercase; font-weight: 700; color: var(--ochre); }
  .tcell .t { font-size: 0.94rem; font-weight: 600; line-height: 1.42; }
  .tcell .box-tick { width: 17px; height: 17px; border: 2px solid var(--indigo); border-radius: 5px; margin-top: auto; }

  .signoff { margin-top: 36px; padding: 28px 30px; border-radius: var(--r); background: var(--indigo); color: var(--on-solid); }
  .signoff .who { font-weight: 700; font-size: 1.06rem; }
  .signoff .what { font-size: 0.86rem; opacity: 0.86; }
  .signoff p { color: var(--on-solid); }
  .signoff .share { font-size: 0.98rem; line-height: 1.68; margin-top: 14px; opacity: 0.93; }

  footer.meta { max-width: 820px; margin: 0 auto; padding: 20px 14px 0; font-size: 0.7rem; color: var(--ink-2); line-height: 1.7; }

  /* ======================= PRINT =======================
     Last in the stylesheet and !important throughout, because a screen rule
     like p.lead is more specific than anything a print rule can reasonably
     say, and print is the last word about its own medium.

     A4 rather than A5 or 6x9in, decided by measurement: the cards render
     ~2.4x their page box at A5 and ~1.8x at A4 under the screen type scale,
     so no trim alone fixes it. The type was composed for an 860px card; A4's
     174mm column is the closest paged equivalent, and 10.5pt at 1.5 is
     ordinary book setting rather than the generous screen setting.

     Screen reading is completely unaffected by any of this. */
  @media print {
    @page { size: A4; margin: 20mm 25mm 20mm; background: var(--paper); }
    html, body { background: var(--paper) !important; }
    .stack { display: block !important; max-width: none !important; margin: 0 !important; padding: 0 !important; gap: 0 !important; }
    footer.meta { display: none !important; }

    /* The page margin now belongs to @page, not to the cards, because the
       cards are no longer sheets. */
    .page { box-shadow: none !important; border-radius: 0 !important;
            margin: 0 !important; padding: 0 !important;
            width: auto !important; min-height: 0 !important;
            background: var(--paper) !important; }
    .page.flush { padding: 0 !important; }
    /* A break is forced only where a book would take one: the cover, every
       chapter opener, and the standalone front and back sections. */
    .page:has(.chap-band), .page:has(.cover-shell), .page.flush,
    .page.prayer-page, .page.closing, .page:has(.toc-banner), .page:has(.myth),
    .page:has(.tracker), .page:has(.qa) { break-before: page; }
    .page:first-child { break-before: auto; }
    .folio { display: none !important; }
    /* Short pages that are forced onto a sheet of their own get centred on
       it, rather than sitting in the top third with a void underneath.
       Safe only where the content is known to be under a page tall. */
    .prayer { padding-block: 0 !important; }
    .prayer h2 { font-size: 19pt !important; margin-bottom: 20pt !important; }
    .prayer .verse { font-size: 12.5pt !important; line-height: 1.95 !important;
                     margin: 22pt auto !important; max-width: 64ch !important; }
    .prayer .verse.second { margin-top: 20pt !important; }
    .prayer .amen { font-size: 12.5pt !important; margin: 0 auto 22pt !important; }
    .prayer hr { max-width: 72% !important; }
    .page.prayer-page { height: 257mm !important; display: flex !important;
